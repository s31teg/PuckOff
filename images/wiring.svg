<text x="1340" y="690" font-size="24" font-weight="bold" fill="#191919" text-anchor="middle" dominant-baseline="middle">Brush motor</text>
<text x="1340" y="846" font-size="18" fill="#5f5f5f" text-anchor="middle" dominant-baseline="middle">370 geared motor, 12 V</text>
<rect x="1166" y="739" width="14" height="14" rx="1" fill="#c8aa5a"/>
<text x="1194" y="746" font-size="24" font-weight="bold" fill="#1e1e22" text-anchor="start" dominant-baseline="middle">−</text>
<rect x="1166" y="787" width="14" height="14" rx="1" fill="#c8aa5a"/>
<text x="1194" y="794" font-size="24" font-weight="bold" fill="#d62828" text-anchor="start" dominant-baseline="middle">+</text>
<polyline points="1166,274 1100,274 1100,370 660,370 660,540" fill="none" stroke="#1e1e22" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1166,746 1100,746 1100,650 660,650 660,540" fill="none" stroke="#1e1e22" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
