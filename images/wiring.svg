<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
