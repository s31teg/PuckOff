<text x="40" y="100" font-size="23" fill="#5f5f5f" text-anchor="start" dominant-baseline="middle">One 12 V supply, two motors. Each push switch only switches its own motor.</text>
<rect x="40" y="420" width="150" height="140" rx="18" fill="#34343a"/>
<text x="115" y="472" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">12 V</text>
