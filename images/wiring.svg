<text x="1340" y="326" font-size="18" fill="#5f5f5f" text-anchor="middle" dominant-baseline="middle">370 geared motor, 12 V</text>
<rect x="1166" y="219" width="14" height="14" rx="1" fill="#c8aa5a"/>
<text x="1194" y="226" font-size="24" font-weight="bold" fill="#d62828" text-anchor="start" dominant-baseline="middle">+</text>
