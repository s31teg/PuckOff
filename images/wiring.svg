<text x="385" y="642" font-size="19" fill="#5f5f5f" text-anchor="middle" dominant-baseline="middle">in the back wall of the tub</text>
<circle cx="820" cy="250" r="46" fill="#28282c" stroke="#141414" stroke-width="2"/><circle cx="820" cy="250" r="36" fill="#bebec4"/><circle cx="820" cy="250" r="24" fill="#e1e1e6" stroke="#969696" stroke-width="2"/>
