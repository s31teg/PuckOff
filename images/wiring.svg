<polyline points="420,440 600,440" fill="none" stroke="#d62828" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="600" cy="440" r="9" fill="#d62828"/>
<polyline points="600,440 600,250 774,250" fill="none" stroke="#d62828" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="600,440 600,770 774,770" fill="none" stroke="#d62828" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="866,250 1040,250 1040,226 1166,226" fill="none" stroke="#d62828" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="866,770 1040,770 1040,794 1166,794" fill="none" stroke="#d62828" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="420" cy="440" r="13" fill="#cdcdd2" stroke="#3c3c3c" stroke-width="2"/><line x1="413" y1="433" x2="427" y2="447" stroke="#505050" stroke-width="3"/>
<circle cx="420" cy="540" r="13" fill="#cdcdd2" stroke="#3c3c3c" stroke-width="2"/><line x1="413" y1="533" x2="427" y2="547" stroke="#505050" stroke-width="3"/>
<text x="394" y="440" font-size="26" font-weight="bold" fill="#ff6b6b" text-anchor="end" dominant-baseline="middle">+</text>
<text x="394" y="540" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="end" dominant-baseline="middle">−</text>
<text x="586" y="420" font-size="20" font-weight="bold" fill="#d62828" text-anchor="end" dominant-baseline="middle">+12 V</text>
<text x="674" y="564" font-size="20" font-weight="bold" fill="#1e1e22" text-anchor="start" dominant-baseline="middle">0 V (−)</text>
<text x="905" y="230" font-size="18" fill="#d62828" text-anchor="start" dominant-baseline="middle">to motor +</text>
<text x="905" y="750" font-size="18" fill="#d62828" text-anchor="start" dominant-baseline="middle">to motor +</text>
<line x1="40" y1="880" x2="1660" y2="880" stroke="#d7d7d7" stroke-width="2"/>
<polyline points="50,917 110,917" fill="none" stroke="#d62828" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="125" y="917" font-size="21" fill="#191919" text-anchor="start" dominant-baseline="middle">+ wire (red)</text>
<polyline points="320,917 380,917" fill="none" stroke="#1e1e22" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="395" y="917" font-size="21" fill="#191919" text-anchor="start" dominant-baseline="middle">− wire (black)</text>
<path d="M600,917 L620,917 A13,13 0 0 1 646,917 L666,917" fill="none" stroke="#1e1e22" stroke-width="7"/><line x1="633" y1="897" x2="633" y2="937" stroke="#d62828" stroke-width="7"/>
<text x="682" y="917" font-size="21" fill="#191919" text-anchor="start" dominant-baseline="middle">wires cross, not joined</text>
<text x="1010" y="917" font-size="21" fill="#191919" text-anchor="start" dominant-baseline="middle">●  joined</text>
<text x="50" y="967" font-size="21" fill="#191919" text-anchor="start" dominant-baseline="middle">All wire 22 AWG. Insulate every joint with heat-shrink.</text>
<text x="50" y="1007" font-size="21" fill="#191919" text-anchor="start" dominant-baseline="middle">Each switch breaks only the + wire of its own motor. Both motors share the − wire back to the socket.</text>
<text x="50" y="1047" font-size="21" fill="#191919" text-anchor="start" dominant-baseline="middle">If a motor turns the wrong way, swap its two wires at the motor, or print the reverse scraper.</text>
</svg>
