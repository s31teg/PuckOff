<text x="820" y="322" font-size="18" fill="#5f5f5f" text-anchor="middle" dominant-baseline="middle">16 mm, momentary, no LED</text>
<circle cx="820" cy="770" r="46" fill="#28282c" stroke="#141414" stroke-width="2"/><circle cx="820" cy="770" r="36" fill="#bebec4"/><circle cx="820" cy="770" r="24" fill="#e1e1e6" stroke="#969696" stroke-width="2"/>
<text x="820" y="690" font-size="24" font-weight="bold" fill="#191919" text-anchor="middle" dominant-baseline="middle">Push switch 2</text>
<text x="820" y="842" font-size="18" fill="#5f5f5f" text-anchor="middle" dominant-baseline="middle">16 mm, momentary, no LED</text>
<rect x="1180" y="204" width="150" height="92" rx="10" fill="#c4c4ca" stroke="#5a5a60" stroke-width="2"/>
